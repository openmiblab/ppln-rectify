name: rectify
channels:
  - pytorch
  - nvidia  # Add this if you have an NVIDIA GPU
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy
  - pandas
  - matplotlib
  - napari
  - pydicom
  - scikit-learn
  - pip

  - pip:
      - -e .    # This installs the pipeline from source
      - pydmr   # Any packages that are not on conda need to be listed here
      - dcmri
      - dbdicom
      - miblab
      - mdreg
      - vreg
      